<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fênix — Sistema de Compras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f5f0;
    --surface: #ffffff;
    --surface2: #f0ede6;
    --border: #e0dcd4;
    --text: #1a1916;
    --text2: #6b6860;
    --accent: #d96f28;
    --accent-light: #f5e4d5;
    --red: #c0392b;
    --red-light: #fdecea;
    --green: #27ae60;
    --green-light: #e8f8ee;
    --radius: 10px;
    --shadow: 0 1px 4px rgba(0,0,0,0.08);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.10);
  }

  html, body { height: 100%; font-family: 'Figtree', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #c8c4bc; border-radius: 2px; }

  /* ─── TOAST ─── */
  #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: var(--text); color: #fff; padding: 12px 18px; border-radius: var(--radius);
    font-size: 14px; font-weight: 500; max-width: 320px; box-shadow: var(--shadow-md);
    animation: slideIn 0.25s ease; display: flex; align-items: center; gap: 10px;
  }
  .toast.success { background: var(--green); }
  .toast.error { background: var(--red); }
  .toast.info { background: var(--accent); }
  @keyframes slideIn { from { transform: translateX(110%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(110%); opacity: 0; } }
  .toast.removing { animation: slideOut 0.25s ease forwards; }

  /* ─── LOGIN SCREEN ─── */
  #login-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg);
  }
  .login-box {
    background: var(--surface); border-radius: 16px; padding: 48px 40px;
    box-shadow: var(--shadow-md); width: 480px; max-width: 96vw;
  }
  .login-logo { font-family: 'Bebas Neue', cursive; font-size: 52px; color: var(--accent); letter-spacing: 2px; margin-bottom: 6px; }
  .login-sub { color: var(--text2); font-size: 14px; margin-bottom: 36px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }
  .login-label { font-size: 13px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; display: block; }
  .login-input {
    width: 100%; border: 1.5px solid var(--border); border-radius: 8px; padding: 11px 14px;
    font-family: 'Figtree', sans-serif; font-size: 15px; color: var(--text); background: var(--bg);
    outline: none; transition: border-color 0.2s;
  }
  .login-input:focus { border-color: var(--accent); }
  .store-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 28px; }
  .store-card {
    border: 2px solid var(--border); border-radius: 10px; padding: 14px 16px; cursor: pointer;
    transition: all 0.18s; background: var(--surface);
  }
  .store-card:hover { border-color: currentColor; background: var(--surface2); }
  .store-card.selected { border-color: currentColor; background: currentColor; }
  .store-card.selected .store-card-name { color: #fff !important; }
  .store-card-dot { width: 10px; height: 10px; border-radius: 50%; margin-bottom: 8px; }
  .store-card-name { font-weight: 700; font-size: 14px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: none; border-radius: 8px; padding: 11px 22px; font-family: 'Figtree', sans-serif;
    font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.18s; text-decoration: none;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #c4621e; }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-sm { padding: 7px 14px; font-size: 13px; }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-danger:hover { background: #a93226; }
  .btn-ghost { background: transparent; color: var(--text2); border: 1.5px solid var(--border); }
  .btn-ghost:hover { background: var(--surface2); }
  .btn-green { background: var(--green); color: #fff; }
  .btn-green:hover { background: #229954; }
  .w-full { width: 100%; }
  .mb-16 { margin-bottom: 16px; }
  .mb-24 { margin-bottom: 24px; }
  .spinner-inline {
    width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─── APP SCREEN ─── */
  #app-screen { display: none; min-height: 100vh; flex-direction: column; }

  /* Header */
  .app-header {
    background: var(--surface); border-bottom: 1.5px solid var(--border);
    padding: 0 28px; height: 64px; display: flex; align-items: center; gap: 16px;
    position: sticky; top: 0; z-index: 100;
  }
  .header-logo { font-family: 'Bebas Neue', cursive; font-size: 32px; color: var(--accent); letter-spacing: 1px; }
  .header-sep { width: 1.5px; height: 28px; background: var(--border); }
  .header-store { font-weight: 700; font-size: 16px; }
  .status-badge {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px;
    border-radius: 20px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .badge-rascunho { background: #e8e6e0; color: #6b6860; }
  .badge-aguardando_aprovacao { background: #fef3e2; color: #c88a00; }
  .badge-aprovada { background: var(--green-light); color: #1e8449; }
  .badge-enviada { background: #e8f4fd; color: #1a6fa3; }
  .badge-cotacoes_recebidas { background: #f0e8ff; color: #7d3c98; }
  .badge-encerrada { background: var(--green-light); color: #1e8449; }
  .badge-rejeitada { background: var(--red-light); color: var(--red); }
  .header-spacer { flex: 1; }
  .header-user { font-size: 13px; color: var(--text2); font-weight: 500; }

  /* Stepper */
  .stepper {
    background: var(--surface); border-bottom: 1.5px solid var(--border);
    padding: 14px 28px; display: flex; align-items: center; gap: 0;
  }
  .step { display: flex; align-items: center; gap: 8px; }
  .step-dot {
    width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 12px;
    font-weight: 700; color: var(--text2); background: var(--bg); flex-shrink: 0;
  }
  .step-dot.active { border-color: var(--accent); background: var(--accent); color: #fff; }
  .step-dot.done { border-color: var(--green); background: var(--green); color: #fff; }
  .step-label { font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.3px; }
  .step-label.active { color: var(--accent); }
  .step-label.done { color: var(--green); }
  .step-line { flex: 1; height: 1.5px; background: var(--border); min-width: 20px; max-width: 60px; }
  .step-line.done { background: var(--green); }

  /* Main content */
  .app-content { flex: 1; padding: 28px; max-width: 1200px; margin: 0 auto; width: 100%; }

  /* Two-column layout */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }

  /* Cards */
  .card { background: var(--surface); border-radius: var(--radius); border: 1.5px solid var(--border); overflow: hidden; }
  .card-header { padding: 16px 20px; border-bottom: 1.5px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .card-title { font-weight: 700; font-size: 15px; }
  .card-body { padding: 20px; }

  /* Form */
  .form-group { margin-bottom: 14px; }
  .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 5px; }
  .form-control {
    width: 100%; border: 1.5px solid var(--border); border-radius: 8px; padding: 9px 12px;
    font-family: 'Figtree', sans-serif; font-size: 14px; color: var(--text); background: var(--bg);
    outline: none; transition: border-color 0.2s;
  }
  .form-control:focus { border-color: var(--accent); }
  .form-control[type="number"] { font-family: 'JetBrains Mono', monospace; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* Items table */
  .items-table { width: 100%; border-collapse: collapse; }
  .items-table th {
    text-align: left; font-size: 11px; font-weight: 700; color: var(--text2);
    text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 10px; border-bottom: 1.5px solid var(--border);
  }
  .items-table td { padding: 10px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .items-table tr:last-child td { border-bottom: none; }
  .item-produto { font-weight: 700; font-size: 14px; }
  .item-categoria {
    display: inline-block; margin-top: 3px; font-size: 11px; font-weight: 600;
    color: var(--accent); background: var(--accent-light); padding: 2px 8px; border-radius: 10px;
  }
  .item-num { font-family: 'JetBrains Mono', monospace; font-size: 13px; }
  .item-obs { font-size: 12px; color: var(--text2); font-style: italic; max-width: 120px; }
  .card-footer { padding: 14px 20px; border-top: 1.5px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--surface2); }
  .item-count { font-size: 13px; color: var(--text2); font-weight: 500; }

  /* Empty state */
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text2); }
  .empty-state-icon { font-size: 36px; margin-bottom: 10px; }
  .empty-state-text { font-size: 14px; }

  /* Status messages */
  .status-message {
    background: var(--surface); border-radius: var(--radius); border: 1.5px solid var(--border);
    padding: 40px; text-align: center; margin-bottom: 24px;
  }
  .status-icon { font-size: 48px; margin-bottom: 16px; }
  .status-title { font-family: 'Bebas Neue', cursive; font-size: 28px; color: var(--text); margin-bottom: 8px; letter-spacing: 1px; }
  .status-desc { color: var(--text2); font-size: 14px; }
  .spinner-lg {
    width: 40px; height: 40px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  /* Rejection card */
  .rejection-card {
    background: var(--red-light); border: 1.5px solid #f5c6c2; border-radius: var(--radius);
    padding: 28px; margin-bottom: 24px;
  }
  .rejection-title { font-weight: 700; font-size: 16px; color: var(--red); margin-bottom: 8px; }
  .rejection-motivo { font-size: 14px; color: var(--text); background: var(--surface); padding: 12px; border-radius: 6px; border: 1px solid #f5c6c2; margin-bottom: 16px; }

  /* Closure view */
  .closure-supplier {
    background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius);
    margin-bottom: 20px; overflow: hidden;
  }
  .closure-supplier-header {
    padding: 16px 20px; background: var(--surface2); border-bottom: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .closure-supplier-name { font-weight: 700; font-size: 16px; }
  .closure-supplier-contact { font-size: 13px; color: var(--text2); }
  .closure-items { padding: 0; }
  .closure-item { padding: 12px 20px; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 1fr auto auto auto; gap: 16px; align-items: center; }
  .closure-item:last-child { border-bottom: none; }
  .closure-item-name { font-weight: 600; font-size: 14px; }
  .closure-item-qty { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text2); }
  .closure-item-price { font-family: 'JetBrains Mono', monospace; font-size: 13px; }
  .closure-item-sub { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; color: var(--accent); }
  .closure-footer { padding: 14px 20px; border-top: 2px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .closure-total { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; color: var(--text); }

  /* History */
  .history-section { margin-top: 40px; }
  .history-title { font-family: 'Bebas Neue', cursive; font-size: 22px; color: var(--text2); letter-spacing: 1px; margin-bottom: 16px; }
  .history-card {
    background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius);
    margin-bottom: 10px; overflow: hidden;
  }
  .history-card-header {
    padding: 14px 18px; display: flex; align-items: center; gap: 12px; cursor: pointer;
    transition: background 0.15s;
  }
  .history-card-header:hover { background: var(--surface2); }
  .history-card-store { font-weight: 700; font-size: 14px; }
  .history-card-date { font-size: 13px; color: var(--text2); }
  .history-card-spacer { flex: 1; }
  .history-card-chevron { color: var(--text2); transition: transform 0.2s; font-size: 18px; }
  .history-card-chevron.open { transform: rotate(180deg); }
  .history-card-body { display: none; padding: 16px 18px; border-top: 1px solid var(--border); }
  .history-card-body.open { display: block; }
  .history-items-mini { font-size: 13px; color: var(--text2); }
  .history-items-mini li { margin-bottom: 4px; }

  /* Read-only table */
  .readonly-notice {
    display: flex; align-items: center; gap: 8px; background: var(--accent-light);
    border: 1px solid #e8c4a0; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px;
    font-size: 13px; color: var(--accent); font-weight: 500;
  }

  /* Cotações chips */
  .cotacao-chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
    border-radius: 20px; font-size: 12px; font-weight: 600; margin: 4px;
  }
  .chip-pendente { background: #fef3e2; color: #c88a00; }
  .chip-respondida { background: var(--green-light); color: #1e8449; }

  .cotacoes-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .cotacao-row {
    background: var(--surface2); border-radius: 8px; padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .cotacao-info { font-size: 13px; }
  .cotacao-nome { font-weight: 700; }
  .cotacao-contato { color: var(--text2); font-size: 12px; }
  .cotacao-link { font-size: 11px; color: var(--text2); word-break: break-all; font-family: 'JetBrains Mono', monospace; }

  /* Util */
  .flex { display: flex; }
  .items-center { align-items: center; }
  .gap-8 { gap: 8px; }
  .mt-16 { margin-top: 16px; }
  .text-center { text-align: center; }
  .text-sm { font-size: 13px; }
  .text-muted { color: var(--text2); }
  .font-mono { font-family: 'JetBrains Mono', monospace; }

  @media (max-width: 768px) {
    .two-col { grid-template-columns: 1fr; }
    .app-content { padding: 16px; }
    .app-header { padding: 0 16px; }
  }
</style>
</head>
<body>

<div id="toast-container"></div>

<!-- ═══════════════════════ LOGIN SCREEN ═══════════════════════ -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">FÊNIX</div>
    <div class="login-sub">Sistema de Compras</div>

    <div class="mb-24">
      <label class="login-label">Seu nome</label>
      <input type="text" id="login-name" class="login-input" placeholder="Ex: João Silva" autocomplete="off">
    </div>

    <div class="mb-24">
      <label class="login-label" style="margin-bottom: 10px;">Selecione a loja</label>
      <div class="store-grid">
        <div class="store-card" data-loja="super_fenix" style="color: #e07b2a;" onclick="selectStore(this)">
          <div class="store-card-dot" style="background: #e07b2a;"></div>
          <div class="store-card-name" style="color: #e07b2a;">Super Fênix</div>
        </div>
        <div class="store-card" data-loja="fenix_219" style="color: #c8960a;" onclick="selectStore(this)">
          <div class="store-card-dot" style="background: #c8960a;"></div>
          <div class="store-card-name" style="color: #c8960a;">Fênix 219</div>
        </div>
        <div class="store-card" data-loja="nova_fenix" style="color: #4a9e6e;" onclick="selectStore(this)">
          <div class="store-card-dot" style="background: #4a9e6e;"></div>
          <div class="store-card-name" style="color: #4a9e6e;">Nova Fênix</div>
        </div>
        <div class="store-card" data-loja="acacia" style="color: #4a7ec4;" onclick="selectStore(this)">
          <div class="store-card-dot" style="background: #4a7ec4;"></div>
          <div class="store-card-name" style="color: #4a7ec4;">Acácia</div>
        </div>
      </div>
    </div>

    <button class="btn btn-primary w-full" id="btn-entrar" disabled onclick="doLogin()">
      Entrar
    </button>
  </div>
</div>

<!-- ═══════════════════════ APP SCREEN ═══════════════════════ -->
<div id="app-screen">

  <!-- Header -->
  <div class="app-header">
    <div class="header-logo">FÊNIX</div>
    <div class="header-sep"></div>
    <div class="header-store" id="header-store-name">—</div>
    <div id="header-status-badge" class="status-badge badge-rascunho">Rascunho</div>
    <div class="header-spacer"></div>
    <div class="header-user" id="header-user-name"></div>
    <button class="btn btn-ghost btn-sm" onclick="doLogout()">Sair</button>
  </div>

  <!-- Stepper -->
  <div class="stepper" id="stepper">
    <div class="step">
      <div class="step-dot" id="step-dot-1">1</div>
      <div class="step-label" id="step-label-1">Rascunho</div>
    </div>
    <div class="step-line" id="step-line-1"></div>
    <div class="step">
      <div class="step-dot" id="step-dot-2">2</div>
      <div class="step-label" id="step-label-2">Aguardando</div>
    </div>
    <div class="step-line" id="step-line-2"></div>
    <div class="step">
      <div class="step-dot" id="step-dot-3">3</div>
      <div class="step-label" id="step-label-3">Aprovada</div>
    </div>
    <div class="step-line" id="step-line-3"></div>
    <div class="step">
      <div class="step-dot" id="step-dot-4">4</div>
      <div class="step-label" id="step-label-4">Encerrada</div>
    </div>
  </div>

  <!-- Content -->
  <div class="app-content" id="app-content">
    <div style="text-align:center; padding: 60px 0;">
      <div class="spinner-lg"></div>
      <div class="text-muted">Carregando...</div>
    </div>
  </div>

</div>

<script>
const { createClient } = supabase;
const db = createClient('https://ccdlreblkvgnidtwinkz.supabase.co', 'sb_publishable_fUFSIIZ0L8BXehhezAFQ6A_fsQ0b9pv');

const CATEGORIAS = ['Mercearia Seca', 'Frios e Laticínios', 'Carnes', 'Limpeza e Higiene', 'Bebidas', 'Bazar e Utilidades'];

const LOJAS = {
  super_fenix: { nome: 'Super Fênix', cor: '#e07b2a' },
  fenix_219:   { nome: 'Fênix 219',   cor: '#c8960a' },
  nova_fenix:  { nome: 'Nova Fênix',  cor: '#4a9e6e' },
  acacia:      { nome: 'Acácia',      cor: '#4a7ec4' }
};

const STATUS_LABELS = {
  rascunho: 'Rascunho',
  aguardando_aprovacao: 'Aguardando Aprovação',
  aprovada: 'Aprovada',
  enviada: 'Enviada',
  cotacoes_recebidas: 'Cotações Recebidas',
  encerrada: 'Encerrada',
  rejeitada: 'Rejeitada'
};

// State
let state = {
  user: null,
  loja: null,
  lista: null,
  itens: [],
  cotacoes: [],
  pollInterval: null
};

// ─── TOAST ───
function toast(msg, type = 'info', duration = 3500) {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = msg;
  c.appendChild(t);
  setTimeout(() => {
    t.classList.add('removing');
    setTimeout(() => t.remove(), 260);
  }, duration);
}

// ─── LOGIN ───
document.getElementById('login-name').addEventListener('input', checkLoginReady);
function checkLoginReady() {
  const name = document.getElementById('login-name').value.trim();
  const loja = document.querySelector('.store-card.selected');
  document.getElementById('btn-entrar').disabled = !(name.length >= 2 && loja);
}

function selectStore(el) {
  document.querySelectorAll('.store-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  checkLoginReady();
}

async function doLogin() {
  const name = document.getElementById('login-name').value.trim();
  const lojaEl = document.querySelector('.store-card.selected');
  if (!name || !lojaEl) return;
  state.user = name;
  state.loja = lojaEl.dataset.loja;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'flex';
  document.getElementById('header-user-name').textContent = name;
  const lojaInfo = LOJAS[state.loja];
  const hn = document.getElementById('header-store-name');
  hn.textContent = lojaInfo.nome;
  hn.style.color = lojaInfo.cor;
  await loadCurrentList();
  startPolling();
}

function doLogout() {
  stopPolling();
  state = { user: null, loja: null, lista: null, itens: [], cotacoes: [], pollInterval: null };
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.querySelectorAll('.store-card').forEach(c => c.classList.remove('selected'));
  document.getElementById('login-name').value = '';
  document.getElementById('btn-entrar').disabled = true;
}

// ─── LOAD CURRENT LIST ───
async function loadCurrentList() {
  renderLoading();
  try {
    const { data, error } = await db
      .from('listas')
      .select('*')
      .eq('loja', state.loja)
      .order('criado_em', { ascending: false })
      .limit(1);
    if (error) throw error;

    if (data && data.length > 0) {
      const lista = data[0];
      state.lista = lista;
      if (['rascunho', 'aguardando_aprovacao', 'aprovada', 'enviada', 'cotacoes_recebidas'].includes(lista.status)) {
        await loadItens();
        if (['aprovada', 'enviada', 'cotacoes_recebidas'].includes(lista.status)) {
          await loadCotacoes();
        }
      } else if (lista.status === 'encerrada') {
        await loadItens();
        await loadCotacoes();
      } else if (lista.status === 'rejeitada') {
        // show rejection view
      }
    } else {
      state.lista = null;
      state.itens = [];
      state.cotacoes = [];
    }
    renderApp();
    await loadHistory();
  } catch (err) {
    console.error(err);
    toast('Erro ao carregar lista: ' + err.message, 'error');
    renderLoading(false);
  }
}

async function loadItens() {
  if (!state.lista) { state.itens = []; return; }
  const { data, error } = await db.from('itens').select('*').eq('lista_id', state.lista.id).order('criado_em', { ascending: true });
  if (error) throw error;
  state.itens = data || [];
}

async function loadCotacoes() {
  if (!state.lista) { state.cotacoes = []; return; }
  const { data, error } = await db.from('cotacoes').select('*').eq('lista_id', state.lista.id).order('criado_em', { ascending: true });
  if (error) throw error;
  state.cotacoes = data || [];
}

// ─── POLLING ───
function startPolling() {
  stopPolling();
  state.pollInterval = setInterval(pollStatus, 30000);
}
function stopPolling() {
  if (state.pollInterval) clearInterval(state.pollInterval);
}
async function pollStatus() {
  if (!state.lista) return;
  try {
    const { data, error } = await db.from('listas').select('status').eq('id', state.lista.id).single();
    if (error || !data) return;
    if (data.status !== state.lista.status) {
      state.lista.status = data.status;
      await loadCurrentList();
      toast('Status atualizado: ' + STATUS_LABELS[data.status], 'info');
    }
  } catch (e) { /* silent */ }
}

// ─── RENDER ───
function renderLoading(show = true) {
  document.getElementById('app-content').innerHTML = show
    ? `<div style="text-align:center; padding:60px 0;"><div class="spinner-lg"></div><div class="text-muted">Carregando...</div></div>`
    : '';
}

function renderApp() {
  updateStepper();
  updateHeaderBadge();
  const status = state.lista ? state.lista.status : 'none';
  if (!state.lista || status === 'rejeitada') {
    renderRejectedOrNew();
  } else if (status === 'rascunho') {
    renderRascunho();
  } else if (status === 'aguardando_aprovacao') {
    renderAguardando();
  } else if (['aprovada', 'enviada', 'cotacoes_recebidas'].includes(status)) {
    renderAprovada();
  } else if (status === 'encerrada') {
    renderEncerrada();
  }
}

function updateHeaderBadge() {
  const badge = document.getElementById('header-status-badge');
  const status = state.lista ? state.lista.status : 'rascunho';
  badge.className = 'status-badge badge-' + status;
  badge.textContent = STATUS_LABELS[status] || status;
}

function updateStepper() {
  const status = state.lista ? state.lista.status : 'rascunho';
  const steps = {
    rascunho: 1,
    aguardando_aprovacao: 2,
    aprovada: 3,
    enviada: 3,
    cotacoes_recebidas: 3,
    encerrada: 4,
    rejeitada: 1
  };
  const cur = steps[status] || 1;
  for (let i = 1; i <= 4; i++) {
    const dot = document.getElementById('step-dot-' + i);
    const lbl = document.getElementById('step-label-' + i);
    if (i < cur) { dot.className = 'step-dot done'; dot.innerHTML = '✓'; lbl.className = 'step-label done'; }
    else if (i === cur) { dot.className = 'step-dot active'; dot.textContent = i; lbl.className = 'step-label active'; }
    else { dot.className = 'step-dot'; dot.textContent = i; lbl.className = 'step-label'; }
    if (i < 4) {
      const line = document.getElementById('step-line-' + i);
      line.className = 'step-line' + (i < cur ? ' done' : '');
    }
  }
}

async function addItem() {
  const produto = document.getElementById('f-produto').value.trim();
  const categoria = document.getElementById('f-categoria').value;
  const qtd = parseFloat(document.getElementById('f-qtd').value) || 0;
  const estoque = document.getElementById('f-estoque').value;
  const obs = document.getElementById('f-obs').value.trim();

  if (!produto) { toast('Informe o nome do produto', 'error'); document.getElementById('f-produto').focus(); return; }
  if (!categoria) { toast('Selecione uma categoria', 'error'); return; }
  if (qtd <= 0) { toast('Informe a quantidade desejada', 'error'); return; }

  const btn = document.getElementById('btn-add-item');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-inline"></span> Adicionando...';

  try {
    // Auto-create list if needed
    if (!state.lista) {
      const { data: newLista, error: le } = await db.from('listas').insert({
        loja: state.loja,
        status: 'rascunho',
        criado_por: state.user
      }).select().single();
      if (le) throw le;
      state.lista = newLista;
    }

    const itemData = {
      lista_id: state.lista.id,
      produto,
      categoria,
      qtd_desejada: qtd,
      estoque_atual: estoque !== '' ? parseFloat(estoque) : null,
      observacao: obs || null
    };
    const { data: newItem, error: ie } = await db.from('itens').insert(itemData).select().single();
    if (ie) throw ie;
    state.itens.push(newItem);
    toast(`"${produto}" adicionado!`, 'success');
    // Reset form
    document.getElementById('f-produto').value = '';
    document.getElementById('f-categoria').value = '';
    document.getElementById('f-qtd').value = '';
    document.getElementById('f-estoque').value = '';
    document.getElementById('f-obs').value = '';
    document.getElementById('f-produto').focus();
    // Update table
    document.querySelector('.card:last-child div[style]').innerHTML = renderItensTable(true);
    document.getElementById('item-count-label').textContent = state.itens.length + ' item(ns)';
    document.getElementById('btn-enviar').disabled = state.itens.length === 0;
  } catch (err) {
    toast('Erro: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '+ Adicionar Produto';
  }
}

async function deleteItem(id) {
  if (!confirm('Remover este item?')) return;
  try {
    const { error } = await db.from('itens').delete().eq('id', id);
    if (error) throw error;
    state.itens = state.itens.filter(i => i.id !== id);
    toast('Item removido', 'info');
    document.querySelector('.card:last-child div[style]').innerHTML = renderItensTable(true);
    document.getElementById('item-count-label').textContent = state.itens.length + ' item(ns)';
    document.getElementById('btn-enviar').disabled = state.itens.length === 0;
  } catch (err) {
    toast('Erro: ' + err.message, 'error');
  }
}

async function enviarAprovacao() {
  if (state.itens.length === 0) { toast('Adicione ao menos um item', 'error'); return; }
  if (!confirm('Enviar lista para aprovação?')) return;
  const btn = document.getElementById('btn-enviar');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-inline"></span> Enviando...';
  try {
    const { error } = await db.from('listas').update({ status: 'aguardando_aprovacao' }).eq('id', state.lista.id);
    if (error) throw error;
    state.lista.status = 'aguardando_aprovacao';
    toast('Lista enviada para aprovação!', 'success');
    renderApp();
  } catch (err) {
    toast('Erro: ' + err.message, 'error');
    btn.disabled = false;
    btn.innerHTML = 'Enviar para Aprovação →';
  }
}

// ─── ENCERRADA ───
async function renderEncerrada() {
  const content = document.getElementById('app-content');
  content.innerHTML = `<div style="text-align:center; padding:40px 0;"><div class="spinner-lg"></div></div>`;
  try {
    // Load respostas for each cotacao
    const cotacaoIds = state.cotacoes.map(c => c.id);
    let respostas = [];
    if (cotacaoIds.length > 0) {
      const { data, error } = await db.from('respostas')
        .select('*')
        .in('cotacao_id', cotacaoIds)
        .eq('status_aprovacao', 'aprovado');
      if (error) throw error;
      respostas = data || [];
    }

    const lojaInfo = LOJAS[state.loja];
    let suppliersHtml = '';

    for (const cot of state.cotacoes) {
      const cotRespostas = respostas.filter(r => r.cotacao_id === cot.id);
      if (cotRespostas.length === 0) continue;
      let total = 0;
      const itemsHtml = cotRespostas.map(r => {
        const item = state.itens.find(i => i.id === r.item_id);
        const qty = r.qtd_aprovada || r.qtd_disponivel || 0;
        const preco = r.preco_ofertado || 0;
        const sub = qty * preco;
        total += sub;
        return `
          <div class="closure-item">
            <div class="closure-item-name">${item ? escHtml(item.produto) : '—'}</div>
            <div class="closure-item-qty">${fmt(qty)} un</div>
            <div class="closure-item-price">R$ ${fmtMoney(preco)}</div>
            <div class="closure-item-sub">R$ ${fmtMoney(sub)}</div>
          </div>
        `;
      }).join('');

      suppliersHtml += `
        <div class="closure-supplier">
          <div class="closure-supplier-header">
            <div>
              <div class="closure-supplier-name">${escHtml(cot.fornecedor_nome)}</div>
              <div class="closure-supplier-contact">${escHtml(cot.fornecedor_contato)}</div>
            </div>
            <button class="btn btn-green btn-sm" onclick="gerarWhatsApp('${cot.id}', ${JSON.stringify(escHtml(cot.fornecedor_contato))})">
              📱 Gerar Mensagem WhatsApp
            </button>
          </div>
          <div class="closure-items">${itemsHtml}</div>
          <div class="closure-footer">
            <span class="text-muted text-sm">Subtotal</span>
            <span class="closure-total">R$ ${fmtMoney(total)}</span>
          </div>
        </div>
      `;
    }

    if (!suppliersHtml) {
      suppliersHtml = `<div class="empty-state"><div class="empty-state-icon">📦</div><div class="empty-state-text">Nenhum item aprovado encontrado</div></div>`;
    }

    content.innerHTML = `
      <div class="status-message" style="margin-bottom: 24px;">
        <div class="status-icon">🎉</div>
        <div class="status-title">Lista Encerrada</div>
        <div class="status-desc">Compra finalizada em ${formatDate(state.lista.encerrado_em)}.</div>
      </div>
      <div style="font-family:'Bebas Neue',cursive; font-size:20px; letter-spacing:1px; margin-bottom:16px; color: var(--text2);">PEDIDOS POR FORNECEDOR</div>
      ${suppliersHtml}
    `;
    // Store respostas in closure for WhatsApp generation
    window._closureRespostas = respostas;
    window._closureCotacoes = state.cotacoes;
  } catch (err) {
    toast('Erro ao carregar encerramento: ' + err.message, 'error');
    content.innerHTML = `<div class="status-message"><div class="status-title">Erro</div><div class="status-desc">${err.message}</div></div>`;
  }
}

function gerarWhatsApp(cotacaoId, contato) {
  const cot = state.cotacoes.find(c => c.id === cotacaoId);
  if (!cot) return;
  const respostas = (window._closureRespostas || []).filter(r => r.cotacao_id === cotacaoId);
  const lojaInfo = LOJAS[state.loja];
  const hoje = new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
  let linhas = `*PEDIDO FÊNIX — ${lojaInfo.nome}*\n📅 ${hoje}\n👤 Fornecedor: ${cot.fornecedor_nome}\n─────────────────\n`;
  let totalGeral = 0;
  for (const r of respostas) {
    const item = state.itens.find(i => i.id === r.item_id);
    const qty = r.qtd_aprovada || r.qtd_disponivel || 0;
    const preco = r.preco_ofertado || 0;
    const sub = qty * preco;
    totalGeral += sub;
    linhas += `📦 *${item ? item.produto : '?'}*\n   Qtd: ${fmt(qty)} un\n   Preço unit.: R$ ${fmtMoney(preco)}\n   Subtotal: R$ ${fmtMoney(sub)}\n─────────────────\n`;
  }
  linhas += `💰 *TOTAL GERAL: R$ ${fmtMoney(totalGeral)}*\nAguardamos confirmação. Obrigado!`;
  const numero = contato.replace(/\D/g, '');
  const url = `https://wa.me/${numero}?text=${encodeURIComponent(linhas)}`;
  window.open(url, '_blank');
}

    </div>
  `;
  ['f-produto','f-categoria','f-qtd','f-estoque','f-obs'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addItem(); } });
  });
}

async function criarNovaLista() {
  state.lista = null;
  state.itens = [];
  state.cotacoes = [];
  renderApp();
}

// ─── HISTORY ───
async function loadHistory() {
  try {
    const { data, error } = await db.from('listas').select('*, itens(count)')
      .eq('loja', state.loja)
      .order('criado_em', { ascending: false })
      .limit(20);
    if (error) throw error;
    const all = data || [];
    // Exclude current lista
    const history = state.lista ? all.filter(l => l.id !== state.lista.id) : all;
    if (history.length === 0) return;

    const content = document.getElementById('app-content');
    const histSection = document.createElement('div');
    histSection.className = 'history-section';
    const histCards = history.map(l => `
      <div class="history-card">
        <div class="history-card-header" onclick="toggleHistory(this)">
          <span class="status-badge badge-${l.status}">${STATUS_LABELS[l.status] || l.status}</span>
          <span class="history-card-date">${formatDate(l.criado_em)}</span>
          <span class="history-card-spacer"></span>
          <span class="history-card-chevron">▾</span>
        </div>
        <div class="history-card-body" data-lista-id="${l.id}">
          <div class="text-muted text-sm">Criado por: ${escHtml(l.criado_por)}</div>
          ${l.motivo_rejeicao ? `<div style="margin-top:8px; font-size:13px; color: var(--red);">Motivo rejeição: ${escHtml(l.motivo_rejeicao)}</div>` : ''}
          <div style="margin-top: 8px;" id="hist-items-${l.id}">
            <div class="text-muted text-sm">Clique para expandir e ver os itens</div>
          </div>
        </div>
      </div>
    `).join('');
    histSection.innerHTML = `<div class="history-title">HISTÓRICO</div>${histCards}`;
    content.appendChild(histSection);
  } catch (e) { /* silent */ }
}

function toggleHistory(header) {
  const body = header.nextElementSibling;
  const chevron = header.querySelector('.history-card-chevron');
  const isOpen = body.classList.contains('open');
  if (!isOpen) {
    body.classList.add('open');
    chevron.classList.add('open');
    loadHistoryItems(body.dataset.listaId);
  } else {
    body.classList.remove('open');
    chevron.classList.remove('open');
  }
}

async function loadHistoryItems(listaId) {
  const container = document.getElementById('hist-items-' + listaId);
  if (!container) return;
  container.innerHTML = '<div class="text-muted text-sm">Carregando...</div>';
  try {
    const { data, error } = await db.from('itens').select('produto, categoria, qtd_desejada').eq('lista_id', listaId).order('criado_em', { ascending: true });
    if (error) throw error;
    if (!data || data.length === 0) {
      container.innerHTML = '<div class="text-muted text-sm">Sem itens</div>';
      return;
    }
    container.innerHTML = `<ul class="history-items-mini" style="padding-left: 16px; margin-top: 8px;">${data.map(i => `<li>${escHtml(i.produto)} — <span class="item-categoria">${escHtml(i.categoria)}</span> — ${fmt(i.qtd_desejada)} un</li>`).join('')}</ul>`;
  } catch (e) { container.innerHTML = '<div class="text-muted text-sm">Erro ao carregar</div>'; }
}

// ─── UTILS ───
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmt(n) {
  if (n == null) return '—';
  const num = parseFloat(n);
  return num % 1 === 0 ? num.toLocaleString('pt-BR') : num.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 3 });
}
function fmtMoney(n) {
  return parseFloat(n || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function formatDate(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}
