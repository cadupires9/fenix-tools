<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fênix — Painel de Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #111210;
    --surface: #161816;
    --surface2: #1e201e;
    --surface3: #252725;
    --border: #2a2c2a;
    --text: #e8e6e0;
    --text2: #8a8880;
    --accent: #e07b2a;
    --accent-dim: #2a1e10;
    --green: #4caf76;
    --green-dim: #0f2018;
    --red: #e05a4a;
    --red-dim: #221210;
    --yellow: #d4b84a;
    --yellow-dim: #251f0a;
    --blue: #4a8ce0;
    --blue-dim: #0a1422;
    --purple: #9b59b6;
    --purple-dim: #1a1022;
    --radius: 10px;
    --shadow: 0 2px 8px rgba(0,0,0,0.4);
  }

  html, body { height: 100%; font-family: 'Figtree', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; overflow: hidden; }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #3a3c3a; border-radius: 2px; }

  /* ─── TOAST ─── */
  #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: var(--surface3); color: var(--text); padding: 12px 18px; border-radius: var(--radius);
    font-size: 13px; font-weight: 500; max-width: 300px; box-shadow: var(--shadow);
    animation: slideIn 0.25s ease; border: 1px solid var(--border);
  }
  .toast.success { border-color: var(--green); color: var(--green); }
  .toast.error { border-color: var(--red); color: var(--red); }
  .toast.info { border-color: var(--accent); color: var(--accent); }
  .toast.removing { animation: slideOut 0.25s ease forwards; }
  @keyframes slideIn { from { transform: translateX(110%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(110%); opacity: 0; } }

  /* ─── LAYOUT ─── */
  .app { display: grid; grid-template-rows: 52px 1fr; height: 100vh; }
  .app-body { display: grid; grid-template-columns: 190px 1fr 340px; overflow: hidden; }

  /* ─── TOP BAR ─── */
  .topbar {
    background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 20px; gap: 16px;
  }
  .topbar-logo { font-family: 'Bebas Neue', cursive; font-size: 28px; color: var(--accent); letter-spacing: 2px; }
  .topbar-sep { width: 1px; height: 24px; background: var(--border); }
  .topbar-label { font-size: 11px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: 1.5px; }
  .topbar-spacer { flex: 1; }
  .kpi-chips { display: flex; gap: 8px; }
  .kpi-chip {
    display: flex; align-items: center; gap: 6px; padding: 5px 12px;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 20px;
    font-size: 12px; font-weight: 600;
  }
  .kpi-chip-label { color: var(--text2); }
  .kpi-chip-val { color: var(--text); font-family: 'JetBrains Mono', monospace; }
  .kpi-chip.kpi-orange { border-color: var(--accent); }
  .kpi-chip.kpi-orange .kpi-chip-val { color: var(--accent); }
  .kpi-chip.kpi-purple { border-color: var(--purple); }
  .kpi-chip.kpi-purple .kpi-chip-val { color: var(--purple); }
  .kpi-chip.kpi-green { border-color: var(--green); }
  .kpi-chip.kpi-green .kpi-chip-val { color: var(--green); }
  .refresh-indicator { font-size: 11px; color: var(--text2); display: flex; align-items: center; gap: 5px; }
  .refresh-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* ─── SIDEBAR ─── */
  .sidebar {
    background: var(--surface); border-right: 1px solid var(--border);
    padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px;
  }
  .sidebar-section-title { font-size: 10px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }
  .filter-btn {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    padding: 7px 10px; border-radius: 7px; border: none; background: transparent;
    color: var(--text2); font-family: 'Figtree', sans-serif; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.15s; text-align: left;
  }
  .filter-btn:hover { background: var(--surface2); color: var(--text); }
  .filter-btn.active { background: var(--surface3); color: var(--text); }
  .filter-count {
    min-width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
    border-radius: 10px; font-size: 11px; font-weight: 700; font-family: 'JetBrains Mono', monospace;
    background: var(--surface3); color: var(--text2); padding: 0 5px;
  }
  .filter-dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; flex-shrink: 0; }

  /* ─── MAIN LIST ─── */
  .main-list { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .list-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    border-left: 4px solid transparent; padding: 14px 16px; cursor: pointer;
    transition: all 0.15s; display: flex; flex-direction: column; gap: 8px;
  }
  .list-card:hover { background: var(--surface2); border-color: var(--border); }
  .list-card.selected { background: var(--surface2); border-color: var(--border); }
  .list-card-top { display: flex; align-items: center; gap: 8px; }
  .list-card-store { font-weight: 700; font-size: 14px; }
  .list-card-spacer { flex: 1; }
  .list-card-date { font-size: 11px; color: var(--text2); font-family: 'JetBrains Mono', monospace; }
  .list-card-bottom { display: flex; align-items: center; justify-content: space-between; }
  .list-card-items { font-size: 12px; color: var(--text2); }
  .status-badge {
    display: inline-flex; align-items: center; padding: 3px 8px;
    border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px;
  }
  .badge-rascunho { background: #252725; color: var(--text2); }
  .badge-aguardando_aprovacao { background: var(--yellow-dim); color: var(--yellow); }
  .badge-aprovada { background: var(--green-dim); color: var(--green); }
  .badge-enviada { background: var(--blue-dim); color: var(--blue); }
  .badge-cotacoes_recebidas { background: var(--purple-dim); color: var(--purple); }
  .badge-encerrada { background: var(--green-dim); color: var(--green); }
  .badge-rejeitada { background: var(--red-dim); color: var(--red); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text2); }
  .empty-state-icon { font-size: 32px; margin-bottom: 10px; }

  /* ─── DETAIL PANEL ─── */
  .detail-panel {
    background: var(--surface); border-left: 1px solid var(--border);
    overflow-y: auto; display: flex; flex-direction: column;
  }
  .detail-placeholder { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; color: var(--text2); }
  .detail-placeholder-icon { font-size: 36px; }
  .detail-placeholder-text { font-size: 14px; }

  .detail-header { padding: 16px; border-bottom: 1px solid var(--border); }
  .detail-store-name { font-weight: 700; font-size: 16px; margin-bottom: 6px; }
  .detail-meta { font-size: 12px; color: var(--text2); margin-top: 4px; }
  .detail-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }

  .detail-section-title { font-size: 11px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }

  /* Action buttons */
  .action-bar { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: none; border-radius: 7px; padding: 8px 16px; font-family: 'Figtree', sans-serif;
    font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s;
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-green { background: var(--green); color: #000; }
  .btn-green:hover:not(:disabled) { background: #3d9e64; }
  .btn-red { background: var(--red); color: #fff; }
  .btn-red:hover:not(:disabled) { background: #c04838; }
  .btn-orange { background: var(--accent); color: #fff; }
  .btn-orange:hover:not(:disabled) { background: #c86820; }
  .btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
  .btn-ghost:hover:not(:disabled) { background: var(--surface2); color: var(--text); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-xs { padding: 3px 8px; font-size: 11px; }

  .spinner-inline {
    width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block;
  }
  .spinner-lg {
    width: 36px; height: 36px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Items list in detail */
  .items-list { display: flex; flex-direction: column; gap: 6px; }
  .item-row {
    background: var(--surface2); border-radius: 7px; padding: 8px 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .item-row-name { font-weight: 600; font-size: 13px; flex: 1; }
  .item-row-cat { font-size: 11px; color: var(--accent); background: var(--accent-dim); padding: 2px 6px; border-radius: 8px; }
  .item-row-qty { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text2); }

  /* Cotacoes */
  .cotacao-item {
    background: var(--surface2); border-radius: 8px; padding: 10px 12px;
    border: 1px solid var(--border);
  }
  .cotacao-item-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .cotacao-nome { font-weight: 700; font-size: 13px; }
  .cotacao-contato { font-size: 12px; color: var(--text2); margin-bottom: 6px; }
  .cotacao-token { font-size: 10px; color: var(--text2); font-family: 'JetBrains Mono', monospace; word-break: break-all; }
  .cotacao-link { color: var(--accent); text-decoration: none; }
  .cotacao-link:hover { text-decoration: underline; }

  /* Price comparison table */
  .price-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .price-table th, .price-table td { padding: 7px 8px; border: 1px solid var(--border); text-align: center; }
  .price-table th { background: var(--surface3); color: var(--text2); font-size: 11px; text-transform: uppercase; }
  .price-table td:first-child { text-align: left; font-weight: 600; max-width: 100px; word-break: break-word; }
  .price-table .price-cell { font-family: 'JetBrains Mono', monospace; }
  .price-best { background: var(--green-dim); color: var(--green) !important; font-weight: 700; }
  .price-unavail { color: var(--text2); font-size: 11px; }

  /* Approval blocks */
  .approval-block { background: var(--surface2); border-radius: 8px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 10px; }
  .approval-block-header { padding: 10px 12px; background: var(--surface3); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .approval-block-name { font-weight: 700; font-size: 13px; }
  .approval-row { padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .approval-row:last-child { border-bottom: none; }
  .approval-row-name { font-size: 13px; flex: 1; min-width: 80px; }
  .approval-price { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text2); }
  .qty-input {
    width: 70px; background: var(--surface); border: 1px solid var(--border); border-radius: 5px;
    padding: 4px 6px; color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 12px; outline: none;
  }
  .qty-input:focus { border-color: var(--accent); }
  .approval-row.denied { opacity: 0.4; }
  .approval-row.approved { background: var(--green-dim); }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 28px; width: 520px; max-width: 96vw; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }
  .modal-title { font-family: 'Bebas Neue', cursive; font-size: 22px; color: var(--text); letter-spacing: 1px; margin-bottom: 20px; }
  .form-group { margin-bottom: 14px; }
  .form-label { display: block; font-size: 11px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
  .form-control {
    width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 7px;
    padding: 9px 12px; color: var(--text); font-family: 'Figtree', sans-serif; font-size: 13px; outline: none;
    transition: border-color 0.2s;
  }
  .form-control:focus { border-color: var(--accent); }
  textarea.form-control { resize: vertical; min-height: 80px; }
  .supplier-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-bottom: 8px; align-items: end; }
  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

  /* Closure whatsapp */
  .closure-block { background: var(--surface2); border-radius: 8px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 10px; }
  .closure-block-header { padding: 10px 12px; background: var(--surface3); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .closure-item-row { padding: 7px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .closure-item-row:last-child { border-bottom: none; }
  .closure-item-name { flex: 1; font-weight: 600; }
  .closure-item-details { color: var(--text2); font-family: 'JetBrains Mono', monospace; font-size: 11px; }
  .closure-total { padding: 10px 12px; border-top: 2px solid var(--border); display: flex; justify-content: space-between; font-weight: 700; }
  .closure-total-val { font-family: 'JetBrains Mono', monospace; color: var(--accent); }

  /* Collapsible */
  .collapsible-toggle { display: flex; align-items: center; justify-content: space-between; cursor: pointer; padding: 8px 0; }
  .collapsible-content { overflow: hidden; }
  .chevron { transition: transform 0.2s; }
  .chevron.open { transform: rotate(180deg); }

  /* Scrollable table container */
  .table-scroll { overflow-x: auto; }

  /* Util */
  .flex { display: flex; }
  .items-center { align-items: center; }
  .gap-8 { gap: 8px; }
  .mt-12 { margin-top: 12px; }
  .text-muted { color: var(--text2); }
  .font-mono { font-family: 'JetBrains Mono', monospace; }
  .text-sm { font-size: 12px; }
  .w-full { width: 100%; }
</style>
</head>
<body>

<div id="toast-container"></div>

<div class="app">
  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-logo">FÊNIX</div>
    <div class="topbar-sep"></div>
    <div class="topbar-label">Painel de Gestão</div>
    <div class="topbar-spacer"></div>
    <div class="kpi-chips">
      <div class="kpi-chip kpi-orange">
        <span class="kpi-chip-label">Pendentes</span>
        <span class="kpi-chip-val" id="kpi-pendentes">—</span>
      </div>
      <div class="kpi-chip kpi-purple">
        <span class="kpi-chip-label">Cotações</span>
        <span class="kpi-chip-val" id="kpi-cotacoes">—</span>
      </div>
      <div class="kpi-chip kpi-green">
        <span class="kpi-chip-label">Encerradas hoje</span>
        <span class="kpi-chip-val" id="kpi-encerradas">—</span>
      </div>
    </div>
    <div style="width:1px; height:24px; background: var(--border); margin: 0 8px;"></div>
    <div class="refresh-indicator">
      <div class="refresh-dot"></div>
      <span id="refresh-label">ao vivo</span>
    </div>
  </div>

  <!-- BODY -->
  <div class="app-body">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div>
        <div class="sidebar-section-title">Lojas</div>
        <div id="loja-filters">
          <button class="filter-btn active" data-loja="" onclick="setLojaFilter(this)">
            <span>Todas</span><span class="filter-count" id="fc-all">0</span>
          </button>
          <button class="filter-btn" data-loja="super_fenix" onclick="setLojaFilter(this)">
            <span style="display:flex;align-items:center;gap:6px;"><span class="filter-dot" style="background:#e07b2a;"></span>Super Fênix</span>
            <span class="filter-count" id="fc-super_fenix">0</span>
          </button>
          <button class="filter-btn" data-loja="fenix_219" onclick="setLojaFilter(this)">
            <span style="display:flex;align-items:center;gap:6px;"><span class="filter-dot" style="background:#c8960a;"></span>Fênix 219</span>
            <span class="filter-count" id="fc-fenix_219">0</span>
          </button>
          <button class="filter-btn" data-loja="nova_fenix" onclick="setLojaFilter(this)">
            <span style="display:flex;align-items:center;gap:6px;"><span class="filter-dot" style="background:#4a9e6e;"></span>Nova Fênix</span>
            <span class="filter-count" id="fc-nova_fenix">0</span>
          </button>
          <button class="filter-btn" data-loja="acacia" onclick="setLojaFilter(this)">
            <span style="display:flex;align-items:center;gap:6px;"><span class="filter-dot" style="background:#4a7ec4;"></span>Acácia</span>
            <span class="filter-count" id="fc-acacia">0</span>
          </button>
        </div>
      </div>
      <div>
        <div class="sidebar-section-title">Status</div>
        <div id="status-filters">
          <button class="filter-btn active" data-status="" onclick="setStatusFilter(this)">Todos</button>
          <button class="filter-btn" data-status="rascunho" onclick="setStatusFilter(this)">Rascunho</button>
          <button class="filter-btn" data-status="aguardando_aprovacao" onclick="setStatusFilter(this)">Aguardando</button>
          <button class="filter-btn" data-status="aprovada" onclick="setStatusFilter(this)">Aprovada</button>
          <button class="filter-btn" data-status="enviada" onclick="setStatusFilter(this)">Enviada</button>
          <button class="filter-btn" data-status="cotacoes_recebidas" onclick="setStatusFilter(this)">Cotações Rec.</button>
          <button class="filter-btn" data-status="encerrada" onclick="setStatusFilter(this)">Encerrada</button>
          <button class="filter-btn" data-status="rejeitada" onclick="setStatusFilter(this)">Rejeitada</button>
        </div>
      </div>
    </div>

    <!-- MAIN LIST -->
    <div class="main-list" id="main-list">
      <div class="empty-state"><div class="spinner-lg" style="margin: 0 auto;"></div></div>
    </div>

    <!-- DETAIL PANEL -->
    <div class="detail-panel" id="detail-panel">
      <div class="detail-placeholder">
        <div class="detail-placeholder-icon">📋</div>
        <div class="detail-placeholder-text">Selecione uma lista</div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: Approve -->
<div id="modal-approve" class="modal-overlay" style="display:none;" onclick="closeModalOnBg(event, 'modal-approve')">
  <div class="modal">
    <div class="modal-title">Aprovar Lista — Adicionar Fornecedores</div>
    <div id="suppliers-container"></div>
    <button class="btn btn-ghost btn-sm" onclick="addSupplierRow()" style="margin-top: 8px;">+ Adicionar Fornecedor</button>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-approve')">Cancelar</button>
      <button class="btn btn-green" id="btn-confirm-approve" onclick="saveApproval()">✓ Confirmar Aprovação</button>
    </div>
  </div>
</div>

<!-- MODAL: Reject -->
<div id="modal-reject" class="modal-overlay" style="display:none;" onclick="closeModalOnBg(event, 'modal-reject')">
  <div class="modal">
    <div class="modal-title">Rejeitar Lista</div>
    <div class="form-group">
      <label class="form-label">Motivo da rejeição</label>
      <textarea id="reject-motivo" class="form-control" rows="4" placeholder="Descreva o motivo..."></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-reject')">Cancelar</button>
      <button class="btn btn-red" onclick="saveRejection()">✕ Confirmar Rejeição</button>
    </div>
  </div>
</div>

<script>
const { createClient } = supabase;
const db = createClient('https://ccdlreblkvgnidtwinkz.supabase.co', 'sb_publishable_fUFSIIZ0L8BXehhezAFQ6A_fsQ0b9pv');

const LOJAS = {
  super_fenix: { nome: 'Super Fênix', cor: '#e07b2a' },
  fenix_219:   { nome: 'Fênix 219',   cor: '#c8960a' },
  nova_fenix:  { nome: 'Nova Fênix',  cor: '#4a9e6e' },
  acacia:      { nome: 'Acácia',      cor: '#4a7ec4' }
};

const STATUS_LABELS = {
  rascunho: 'Rascunho',
  aguardando_aprovacao: 'Aguardando',
  aprovada: 'Aprovada',
  enviada: 'Enviada',
  cotacoes_recebidas: 'Cotações Rec.',
  encerrada: 'Encerrada',
  rejeitada: 'Rejeitada'
};

let state = {
  listas: [],
  lojaFilter: '',
  statusFilter: '',
  selectedListaId: null,
  selectedLista: null,
  selectedItens: [],
  selectedCotacoes: [],
  selectedRespostas: [],
  refreshInterval: null
};

// ─── TOAST ───
function toast(msg, type = 'info', dur = 3500) {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.classList.add('removing'); setTimeout(() => t.remove(), 260); }, dur);
}

// ─── INIT ───
async function init() {
  await Promise.all([loadKPIs(), loadLists()]);
  state.refreshInterval = setInterval(autoRefresh, 30000);
}

async function autoRefresh() {
  await Promise.all([loadKPIs(), loadLists()]);
  if (state.selectedListaId) {
    const updated = state.listas.find(l => l.id === state.selectedListaId);
    if (updated && updated.status !== (state.selectedLista && state.selectedLista.status)) {
      await selectList(state.selectedListaId);
    }
  }
  document.getElementById('refresh-label').textContent = 'atualizado ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

// ─── KPIs ───
async function loadKPIs() {
  try {
    const { data, error } = await db.from('listas').select('status, encerrado_em');
    if (error) throw error;
    const rows = data || [];
    const pendentes = rows.filter(r => r.status === 'aguardando_aprovacao').length;
    const cotacoes = rows.filter(r => r.status === 'cotacoes_recebidas').length;
    const hoje = new Date().toDateString();
    const encerradas = rows.filter(r => r.status === 'encerrada' && r.encerrado_em && new Date(r.encerrado_em).toDateString() === hoje).length;
    document.getElementById('kpi-pendentes').textContent = pendentes;
    document.getElementById('kpi-cotacoes').textContent = cotacoes;
    document.getElementById('kpi-encerradas').textContent = encerradas;
  } catch (e) { /* silent */ }
}

// ─── LOAD LISTS ───
async function loadLists() {
  try {
    let q = db.from('listas').select('*').order('criado_em', { ascending: false });
    const { data, error } = await q;
    if (error) throw error;
    state.listas = data || [];
    updateFilterCounts();
    renderLists();
  } catch (err) {
    document.getElementById('main-list').innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><div>Erro: ${err.message}</div></div>`;
  }
}

function updateFilterCounts() {
  const all = state.listas;
  document.getElementById('fc-all').textContent = all.length;
  ['super_fenix','fenix_219','nova_fenix','acacia'].forEach(loja => {
    const el = document.getElementById('fc-' + loja);
    if (el) el.textContent = all.filter(l => l.loja === loja).length;
  });
}

function renderLists() {
  const filtered = state.listas.filter(l => {
    if (state.lojaFilter && l.loja !== state.lojaFilter) return false;
    if (state.statusFilter && l.status !== state.statusFilter) return false;
    return true;
  });
  const container = document.getElementById('main-list');
  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📭</div><div>Nenhuma lista encontrada</div></div>`;
    return;
  }
  container.innerHTML = filtered.map(l => {
    const loja = LOJAS[l.loja] || { nome: l.loja, cor: '#888' };
    const selected = l.id === state.selectedListaId ? 'selected' : '';
    return `
      <div class="list-card ${selected}" style="border-left-color: ${loja.cor};" onclick="selectList('${l.id}')">
        <div class="list-card-top">
          <span class="list-card-store" style="color: ${loja.cor};">${loja.nome}</span>
          <span class="list-card-spacer"></span>
          <span class="status-badge badge-${l.status}">${STATUS_LABELS[l.status] || l.status}</span>
        </div>
        <div class="list-card-bottom">
          <span class="list-card-items">Criado por: ${escHtml(l.criado_por)}</span>
          <span class="list-card-date">${formatDateShort(l.criado_em)}</span>
        </div>
      </div>
    `;
  }).join('');
}

// ─── FILTERS ───
function setLojaFilter(btn) {
  document.querySelectorAll('#loja-filters .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.lojaFilter = btn.dataset.loja;
  renderLists();
}
function setStatusFilter(btn) {
  document.querySelectorAll('#status-filters .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.statusFilter = btn.dataset.status;
  renderLists();
}

// ─── SELECT LIST ───
async function selectList(id) {
  state.selectedListaId = id;
  renderLists();
  const panel = document.getElementById('detail-panel');
  panel.innerHTML = `<div class="detail-placeholder"><div class="spinner-lg"></div></div>`;
  try {
    const [listaRes, itensRes] = await Promise.all([
      db.from('listas').select('*').eq('id', id).single(),
      db.from('itens').select('*').eq('lista_id', id).order('criado_em', { ascending: true })
    ]);
    if (listaRes.error) throw listaRes.error;
    state.selectedLista = listaRes.data;
    state.selectedItens = itensRes.data || [];

    // Load cotacoes if relevant
    state.selectedCotacoes = [];
    state.selectedRespostas = [];
    const relevantStatuses = ['aprovada','enviada','cotacoes_recebidas','encerrada'];
    if (relevantStatuses.includes(state.selectedLista.status)) {
      const cotRes = await db.from('cotacoes').select('*').eq('lista_id', id).order('criado_em', { ascending: true });
      if (!cotRes.error) {
        state.selectedCotacoes = cotRes.data || [];
        if (state.selectedCotacoes.length > 0) {
          const cotIds = state.selectedCotacoes.map(c => c.id);
          const respRes = await db.from('respostas').select('*').in('cotacao_id', cotIds);
          if (!respRes.error) state.selectedRespostas = respRes.data || [];
        }
      }
    }
    renderDetail();
  } catch (err) {
    panel.innerHTML = `<div class="detail-placeholder"><div>Erro: ${err.message}</div></div>`;
    toast('Erro ao carregar lista', 'error');
  }
}

// ─── RENDER DETAIL ───

  const lista = state.selectedLista;
  const loja = LOJAS[lista.loja] || { nome: lista.loja, cor: '#888' };

  if (lista.status === 'aguardando_aprovacao') {
    actionBar = `
      <div class="action-bar">
        <button class="btn btn-green" onclick="approveList()">✓ Aprovar Lista</button>

      </div>

    </div>

  let cotacoesHtml = '';

    cotacoesHtml = `
      <div>
        <div class="detail-section-title">Fornecedores</div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          ${state.selectedCotacoes.map(c => `
            <div class="cotacao-item">
              <div class="cotacao-item-top">
                <div class="cotacao-nome">${escHtml(c.fornecedor_nome)}</div>
                <span class="status-badge badge-${c.status === 'respondida' ? 'aprovada' : 'aguardando_aprovacao'}">${c.status === 'respondida' ? '✓ Respondida' : '⏳ Pendente'}</span>
              </div>
              <div class="cotacao-contato">${escHtml(c.fornecedor_contato)}</div>
              <div class="cotacao-token">
                Link: <a class="cotacao-link" href="fornecedor.html?token=${c.token}" target="_blank">fornecedor.html?token=${c.token}</a>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;

    priceCompHtml = buildPriceComparison();
  }

  if (lista.status === 'cotacoes_recebidas') {
    approvalHtml = buildApprovalBlocks();
  }

  let finalizeBtn = '';
  if (lista.status === 'cotacoes_recebidas') {
    finalizeBtn = `<button class="btn btn-orange w-full" onclick="finalizeList()">🏁 Finalizar Lista</button>`;
  }

        <div style="color: var(--red); font-weight: 700; margin-bottom: 6px;">Motivo da Rejeição</div>
        <div style="font-size: 13px;">${escHtml(lista.motivo_rejeicao)}</div>

  panel.innerHTML = `
    <div class="detail-header">
      <div class="detail-store-name" style="color: ${loja.cor};">${loja.nome}</div>

        <span class="detail-meta">${formatDateShort(lista.criado_em)}</span>
      </div>

// ─── PRICE COMPARISON ───
function buildPriceComparison() {
  const cots = state.selectedCotacoes;
  const itens = state.selectedItens;
  const respostas = state.selectedRespostas;
  if (cots.length === 0 || itens.length === 0) return '';

  const header = `<th>Produto</th>` + cots.map(c => `<th title="${escHtml(c.fornecedor_nome)}">${escHtml(c.fornecedor_nome.split(' ')[0])}</th>`).join('');
  const rows = itens.map(it => {
    const prices = cots.map(c => {
      const r = respostas.find(r => r.cotacao_id === c.id && r.item_id === it.id);
      return r ? (r.preco_ofertado || 0) : null;
    });
    const validPrices = prices.filter(p => p !== null && p > 0);
    const minPrice = validPrices.length > 0 ? Math.min(...validPrices) : null;
    const cells = prices.map(p => {
      if (p === null) return `<td class="price-unavail">—</td>`;
      if (p === 0) return `<td class="price-unavail">N/D</td>`;
      const isBest = p === minPrice;
      return `<td class="price-cell ${isBest ? 'price-best' : ''}">${isBest ? '👑 ' : ''}R$ ${fmtMoney(p)}</td>`;
    }).join('');
    return `<tr><td>${escHtml(it.produto)}</td>${cells}</tr>`;
  }).join('');

  return `
    <div>
      <div class="collapsible-toggle" onclick="toggleCollapsible(this)">
        <div class="detail-section-title" style="margin:0;">Comparativo de Preços</div>
        <span class="chevron">▾</span>
      </div>
      <div class="collapsible-content">
        <div class="table-scroll">
          <table class="price-table">
            <thead><tr>${header}</tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

// ─── APPROVAL BLOCKS ───
function buildApprovalBlocks() {
  const cots = state.selectedCotacoes;
  if (cots.length === 0) return '';

  const blocks = cots.map(c => {
    const cRespostas = state.selectedRespostas.filter(r => r.cotacao_id === c.id && (r.preco_ofertado || 0) > 0);
    if (cRespostas.length === 0) return '';
    const rows = cRespostas.map(r => {
      const item = state.selectedItens.find(i => i.id === r.item_id);
      const statusCls = r.status_aprovacao === 'aprovado' ? 'approved' : r.status_aprovacao === 'negado' ? 'denied' : '';
      return `
        <div class="approval-row ${statusCls}" id="apr-row-${r.id}">
          <span class="approval-row-name">${item ? escHtml(item.produto) : '?'}</span>
          <span class="approval-price">R$ ${fmtMoney(r.preco_ofertado)}</span>
          <input type="number" class="qty-input" id="qty-${r.id}" value="${r.qtd_aprovada || r.qtd_disponivel || ''}" min="0" step="0.001" placeholder="Qtd">
          <button class="btn btn-green btn-xs" onclick="approveItem('${r.id}', '${c.id}')">✓</button>
          <button class="btn btn-red btn-xs" onclick="denyItem('${r.id}')">✕</button>
        </div>
      `;
    }).join('');
    return `
      <div class="approval-block">
        <div class="approval-block-header">
          <span class="approval-block-name">${escHtml(c.fornecedor_nome)}</span>
          <button class="btn btn-green btn-xs" onclick="approveAllFromSupplier('${c.id}')">Aprovar Tudo</button>
        </div>
        ${rows}
      </div>
    `;
  }).join('');

  return `
    <div>
      <div class="detail-section-title">Aprovação de Itens</div>
      ${blocks}
    </div>
  `;
}

// ─── CLOSURE VIEW ───
function buildClosureView() {
  const cots = state.selectedCotacoes;
  const approvedRespostas = state.selectedRespostas.filter(r => r.status_aprovacao === 'aprovado');
  if (approvedRespostas.length === 0) return '';

  const blocks = cots.map(c => {
    const cRespostas = approvedRespostas.filter(r => r.cotacao_id === c.id);
    if (cRespostas.length === 0) return '';
    let total = 0;
    const rows = cRespostas.map(r => {
      const item = state.selectedItens.find(i => i.id === r.item_id);
      const qty = r.qtd_aprovada || r.qtd_disponivel || 0;
      const preco = r.preco_ofertado || 0;
      const sub = qty * preco;
      total += sub;
      return `<div class="closure-item-row"><span class="closure-item-name">${item ? escHtml(item.produto) : '?'}</span><span class="closure-item-details">${fmt(qty)} un × R$ ${fmtMoney(preco)} = R$ ${fmtMoney(sub)}</span></div>`;
    }).join('');
    return `
      <div class="closure-block">
        <div class="closure-block-header">
          <span style="font-weight:700;">${escHtml(c.fornecedor_nome)}</span>
          <button class="btn btn-green btn-sm" onclick="generateWhatsApp('${c.id}')">📱 WhatsApp</button>
        </div>
        ${rows}
        <div class="closure-total"><span>Total</span><span class="closure-total-val">R$ ${fmtMoney(total)}</span></div>
      </div>
    `;
  }).join('');

  return `<div><div class="detail-section-title">Resumo do Pedido</div>${blocks}</div>`;
}

function toggleCollapsible(header) {
  const content = header.nextElementSibling;
  const chevron = header.querySelector('.chevron');
  const isOpen = !content.style.display || content.style.display !== 'none';
  content.style.display = isOpen ? 'none' : '';
  chevron.classList.toggle('open', !isOpen);
}

// ─── APPROVE ───
function approveList() {
  document.getElementById('suppliers-container').innerHTML = '';
  addSupplierRow();
  addSupplierRow();
  document.getElementById('modal-approve').style.display = 'flex';
}

function addSupplierRow() {
  const c = document.getElementById('suppliers-container');
  const row = document.createElement('div');
  row.className = 'supplier-row';
  row.innerHTML = `
    <div class="form-group" style="margin:0;">
      <label class="form-label">Nome</label>
      <input type="text" class="form-control sup-nome" placeholder="Nome do fornecedor">
    </div>
    <div class="form-group" style="margin:0;">
      <label class="form-label">WhatsApp</label>
      <input type="text" class="form-control sup-contato" placeholder="5511999999999">
    </div>
    <button class="btn btn-ghost btn-sm" style="margin-top:20px;" onclick="this.parentElement.remove()">✕</button>
  `;
  c.appendChild(row);
}

async function saveApproval() {
  const listaId = state.selectedListaId;
  const rows = document.querySelectorAll('.supplier-row');
  const suppliers = [];
  rows.forEach(row => {
    const nome = row.querySelector('.sup-nome').value.trim();
    const contato = row.querySelector('.sup-contato').value.trim();
    if (nome && contato) suppliers.push({ nome, contato });
  });
  if (suppliers.length === 0) { toast('Adicione ao menos um fornecedor', 'error'); return; }
  const btn = document.getElementById('btn-confirm-approve');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-inline"></span> Processando...';
  try {
    const cotInserts = suppliers.map(s => ({
      lista_id: listaId,
      fornecedor_nome: s.nome,
      fornecedor_contato: s.contato,
      token: generateToken(),
      status: 'pendente'
    }));
    const { error: ce } = await db.from('cotacoes').insert(cotInserts);
    if (ce) throw ce;
    const { error: le } = await db.from('listas').update({ status: 'aprovada', aprovado_em: new Date().toISOString() }).eq('id', listaId);
    if (le) throw le;
    toast('Lista aprovada! Fornecedores adicionados.', 'success');
    closeModal('modal-approve');
    await loadLists();
    await selectList(listaId);
  } catch (err) {
    toast('Erro: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '✓ Confirmar Aprovação';
  }
}

// ─── REJECT ───
function rejectList() {
  document.getElementById('reject-motivo').value = '';
  document.getElementById('modal-reject').style.display = 'flex';
}

async function saveRejection() {
  const motivo = document.getElementById('reject-motivo').value.trim();
  if (!motivo) { toast('Informe o motivo da rejeição', 'error'); return; }
  const listaId = state.selectedListaId;
  try {
    const { error } = await db.from('listas').update({
      status: 'rejeitada',
      rejeitado_em: new Date().toISOString(),
      motivo_rejeicao: motivo
    }).eq('id', listaId);
    if (error) throw error;
    toast('Lista rejeitada', 'info');
    closeModal('modal-reject');
    await loadLists();
    await selectList(listaId);
  } catch (err) {
    toast('Erro: ' + err.message, 'error');
  }
}

// ─── ITEM APPROVAL ───
async function approveItem(respostaId, cotacaoId) {
  const qtdEl = document.getElementById('qty-' + respostaId);
  const qtd = parseFloat(qtdEl ? qtdEl.value : 0) || 0;
  if (qtd <= 0) { toast('Informe a quantidade aprovada', 'error'); return; }
  try {
    const { error } = await db.from('respostas').update({ status_aprovacao: 'aprovado', qtd_aprovada: qtd }).eq('id', respostaId);
    if (error) throw error;
    const r = state.selectedRespostas.find(r => r.id === respostaId);
    if (r) { r.status_aprovacao = 'aprovado'; r.qtd_aprovada = qtd; }
    const row = document.getElementById('apr-row-' + respostaId);
    if (row) { row.classList.remove('denied'); row.classList.add('approved'); }
    toast('Item aprovado', 'success');
  } catch (err) {
    toast('Erro: ' + err.message, 'error');
  }
}

async function denyItem(respostaId) {
  try {
    const { error } = await db.from('respostas').update({ status_aprovacao: 'negado' }).eq('id', respostaId);
    if (error) throw error;
    const r = state.selectedRespostas.find(r => r.id === respostaId);
    if (r) r.status_aprovacao = 'negado';
    const row = document.getElementById('apr-row-' + respostaId);
    if (row) { row.classList.remove('approved'); row.classList.add('denied'); }
    toast('Item negado', 'info');
  } catch (err) {
    toast('Erro: ' + err.message, 'error');
  }
}

async function approveAllFromSupplier(cotacaoId) {
  const cRespostas = state.selectedRespostas.filter(r => r.cotacao_id === cotacaoId && (r.preco_ofertado || 0) > 0 && r.status_aprovacao === 'pendente');
  if (cRespostas.length === 0) { toast('Nenhum item pendente', 'info'); return; }
  try {
    for (const r of cRespostas) {
      const qtdEl = document.getElementById('qty-' + r.id);
      const qtd = parseFloat(qtdEl ? qtdEl.value : 0) || r.qtd_disponivel || 0;
      await db.from('respostas').update({ status_aprovacao: 'aprovado', qtd_aprovada: qtd }).eq('id', r.id);
      r.status_aprovacao = 'aprovado';
      r.qtd_aprovada = qtd;
      const row = document.getElementById('apr-row-' + r.id);
      if (row) { row.classList.remove('denied'); row.classList.add('approved'); }
    }
    toast('Todos os itens aprovados', 'success');
  } catch (err) {
    toast('Erro: ' + err.message, 'error');
  }
}

// ─── FINALIZE ───
async function finalizeList() {
  if (!confirm('Finalizar lista? Esta ação não pode ser desfeita.')) return;
  try {
    const { error } = await db.from('listas').update({ status: 'encerrada', encerrado_em: new Date().toISOString() }).eq('id', state.selectedListaId);
    if (error) throw error;
    toast('Lista encerrada!', 'success');
    await loadLists();
    await selectList(state.selectedListaId);
  } catch (err) {
    toast('Erro: ' + err.message, 'error');
  }
}

// ─── WHATSAPP ───
function generateWhatsApp(cotacaoId) {
  const cot = state.selectedCotacoes.find(c => c.id === cotacaoId);
  if (!cot) return;
  const lista = state.selectedLista;
  const loja = LOJAS[lista.loja] || { nome: lista.loja };
  const respostas = state.selectedRespostas.filter(r => r.cotacao_id === cotacaoId && r.status_aprovacao === 'aprovado');
  const hoje = new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
  let msg = `*PEDIDO FÊNIX — ${loja.nome}*\n📅 ${hoje}\n👤 Fornecedor: ${cot.fornecedor_nome}\n─────────────────\n`;
  let totalGeral = 0;
  for (const r of respostas) {
    const item = state.selectedItens.find(i => i.id === r.item_id);
    const qty = r.qtd_aprovada || r.qtd_disponivel || 0;
    const preco = r.preco_ofertado || 0;
    const sub = qty * preco;
    totalGeral += sub;
    msg += `📦 *${item ? item.produto : '?'}*\n   Qtd: ${fmt(qty)} un\n   Preço unit.: R$ ${fmtMoney(preco)}\n   Subtotal: R$ ${fmtMoney(sub)}\n─────────────────\n`;
  }
  msg += `💰 *TOTAL GERAL: R$ ${fmtMoney(totalGeral)}*\nAguardamos confirmação. Obrigado!`;
  const numero = cot.fornecedor_contato.replace(/\D/g, '');
  window.open(`https://wa.me/${numero}?text=${encodeURIComponent(msg)}`, '_blank');
}

// ─── TOKEN GENERATION ───
function generateToken() {
  const arr = new Uint8Array(16);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
}

// ─── MODAL HELPERS ───
function closeModal(id) { document.getElementById(id).style.display = 'none'; }
function closeModalOnBg(e, id) { if (e.target.id === id) closeModal(id); }

// ─── UTILS ───
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmt(n) {
  if (n == null) return '—';
  const num = parseFloat(n);
  return num % 1 === 0 ? num.toLocaleString('pt-BR') : num.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 3 });
}
function fmtMoney(n) {
  return parseFloat(n || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function formatDateShort(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

init();
</script>
